name: daily-article

on:
  schedule:
    - cron: '0 6 * * *'   # 9:00 по Москве (UTC+3)
  workflow_dispatch: {}    # позволяет запустить вручную кнопкой на GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # если что-то зависнет — job остановится сам через 10 минут
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python3 -u zen_bot.py
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: |
          git config user.name "zen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_topics.json
          git commit -m "update used topics" || echo "nothing to commit"
          git push
